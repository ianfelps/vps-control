name: Deploy

# Implanta na VPS depois que o CI passa na main, ou manualmente (inclusive rollback para um SHA).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "SHA completo do commit (vazio = HEAD da main). Use um SHA antigo para rollback."
        required: false

# Um deploy por vez; o seguinte espera (não cancela um deploy em andamento).
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Inativo até a variável VPS_HOST ser configurada (evita falhas antes do setup da VPS).
    if: >-
      vars.VPS_HOST != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - name: Resolver versão
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="${INPUT_VERSION:-${RUN_SHA:-$GITHUB_SHA}}"
          if [[ ! "$version" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::versão inválida: '$version' (use o SHA completo)"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/vps-control-api:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false

      - name: Bundle do host (agente AOT + compose + scripts)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/bundle.Dockerfile
          build-args: ARCH=${{ vars.VPS_ARCH || 'x64' }}
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/vps-control-bundle:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=bundle
          cache-to: type=gha,mode=max,scope=bundle
          provenance: false

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    # Configure em Settings → Environments → production (opcional: exigir aprovação manual).
    environment: production
    timeout-minutes: 15
    steps:
      - name: Entrar na tailnet (nó efêmero tag:ci)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Implantar na VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if [[ -z "$VPS_HOST" ]]; then echo "::error::defina a variável VPS_HOST"; exit 1; fi
          # Tailscale SSH: sem chave SSH no GitHub; a ACL só permite tag:ci → usuário deploy.
          tailscale ssh "deploy@${VPS_HOST}" sudo /opt/vps-control/bin/deploy.sh "$VERSION"

      - name: Resumo
        if: always()
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          PREFIX: ${{ needs.publish.outputs.prefix }}
        run: |
          {
            echo "### Deploy ${{ job.status }}"
            echo "- Versão: \`$VERSION\`"
            echo "- API: \`$PREFIX/vps-control-api:$VERSION\`"
            echo "- Rollback: rode este workflow manualmente informando um SHA anterior."
          } >> "$GITHUB_STEP_SUMMARY"
