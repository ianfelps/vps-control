name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - name: OpenAPI versionado está atualizado
        run: git diff --exit-code -- apps/web/openapi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos gerados do OpenAPI estão atualizados
        run: pnpm --filter @vps-control/web gen:api && git diff --exit-code -- apps/web/src/api/schema.d.ts
      - run: pnpm --filter @vps-control/web lint
      - run: pnpm --filter @vps-control/web format:check
      - run: pnpm --filter @vps-control/web test
      - run: pnpm --filter @vps-control/web build

  images:
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v4
      - name: Imagem da API
        run: docker build -f deploy/docker/api.Dockerfile -t vps-control-api:ci .
      - name: Agente Native AOT
        run: bash deploy/scripts/build-agent.sh x64
